# Smart Parks Protect development stack.
#   cp .env.example .env
#   docker compose up -d                        # infrastructure, api, frontend
#   docker compose --profile chirpstack up -d   # adds a local ChirpStack for LoRaWAN testing
# Every container is named protect-<service> and joins protect-network. Data lives in named volumes.

name: smartparks-protect

services:
  postgres:
    container_name: protect-postgres
    image: timescale/timescaledb-ha:pg17.10-ts2.29.2
    restart: unless-stopped
    # An init process as PID 1. Without it PostgreSQL is PID 1 and pgBackRest's detached
    # asynchronous archive process gets reparented to the postmaster, which treats that unknown
    # child's exit as a crashed backend and restarts the whole cluster (seen on the dev server).
    init: true
    # WAL archiving is always on; the wrapper drops segments until BACKUP_ENABLED is true, then
    # pushes them to the pgBackRest repository (architecture 28.4). archive_timeout forces a
    # segment every 15 minutes on a quiet server so the recovery point stays under an hour.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/protect-pgbackrest --stanza=protect archive-push %p
      - -c
      - wal_level=replica
      - -c
      - archive_timeout=900
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      # pgBackRest reads its options from the environment (PGBACKREST_<OPTION>); the stanza and
      # container paths are in docker/postgres/pgbackrest.conf.
      PGBACKREST_STANZA: protect
      PGBACKREST_PG1_USER: ${POSTGRES_USER}
      PGBACKREST_PG1_DATABASE: ${POSTGRES_DB}
      PGBACKREST_REPO1_TYPE: ${BACKUP_REPO_TYPE:-s3}
      PGBACKREST_REPO1_PATH: ${BACKUP_REPO_PATH:-/smartparks-protect/pgbackrest}
      PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-backup.invalid}
      PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_S3_BUCKET:-unset}
      PGBACKREST_REPO1_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      PGBACKREST_REPO1_S3_KEY: ${BACKUP_S3_KEY:-unset}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_S3_KEY_SECRET:-unset}
      PGBACKREST_REPO1_S3_URI_STYLE: ${BACKUP_S3_URI_STYLE:-path}
      PGBACKREST_REPO1_CIPHER_TYPE: ${BACKUP_CIPHER_PASS:+aes-256-cbc}
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:-}
      PGBACKREST_REPO1_RETENTION_FULL: ${BACKUP_RETENTION_FULL:-4}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/home/postgres/pgdata/data
      - pgbackrest-state:/home/postgres/pgdata/backup
      - ./docker/postgres/pgbackrest.conf:/home/postgres/pgdata/backup/pgbackrest.conf:ro
      - ./docker/postgres/pgbackrest-wrapper.sh:/usr/local/bin/protect-pgbackrest:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    container_name: protect-redis
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    container_name: protect-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    container_name: protect-minio-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_UPLOADS: ${MINIO_BUCKET_UPLOADS:-uploads}
      MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS:-exports}
      MINIO_BUCKET_LOG_FILES: ${MINIO_BUCKET_LOG_FILES:-device-log-files}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_UPLOADS local/$$MINIO_BUCKET_EXPORTS local/$$MINIO_BUCKET_LOG_FILES &&
      echo buckets ready"

  migrate:
    container_name: protect-migrate
    build: &python-build
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ["/app/.venv/bin/alembic", "-c", "services/api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &python-env
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_UPLOADS: ${MINIO_BUCKET_UPLOADS:-uploads}
      MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS:-exports}
      MINIO_BUCKET_LOG_FILES: ${MINIO_BUCKET_LOG_FILES:-device-log-files}
      JWT_SECRET: ${JWT_SECRET}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      BUS_MAXLEN: ${BUS_MAXLEN:-100000}
      BUS_DEAD_MAXLEN: ${BUS_DEAD_MAXLEN:-10000}
      BUS_MAX_ATTEMPTS: ${BUS_MAX_ATTEMPTS:-5}
      BUS_RETRY_BASE_SECONDS: ${BUS_RETRY_BASE_SECONDS:-5}
      BUS_CONCURRENCY: ${BUS_CONCURRENCY:-8}
      HEARTBEAT_STALE_MINUTES: ${HEARTBEAT_STALE_MINUTES:-15}
      PAYLOAD_INLINE_MAX_BYTES: ${PAYLOAD_INLINE_MAX_BYTES:-65536}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      DEV_NOTIFY_EMAILS: ${DEV_NOTIFY_EMAILS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RULES_RELOAD_SECONDS: ${RULES_RELOAD_SECONDS:-10}
      SYSTEM_CHECK_INTERVAL_SECONDS: ${SYSTEM_CHECK_INTERVAL_SECONDS:-300}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_REPO_TYPE: ${BACKUP_REPO_TYPE:-s3}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_SECURE: ${BACKUP_S3_SECURE:-true}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_KEY: ${BACKUP_S3_KEY:-}
      BACKUP_S3_KEY_SECRET: ${BACKUP_S3_KEY_SECRET:-}
      BACKUP_OBJECT_PREFIX: ${BACKUP_OBJECT_PREFIX:-objects}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

  api:
    container_name: protect-api
    build: *python-build
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *python-env
      JWT_LIFETIME_SECONDS: ${JWT_LIFETIME_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      INVITATION_LIFETIME_HOURS: ${INVITATION_LIFETIME_HOURS:-168}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/version', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  ingest:
    container_name: protect-ingest
    build: *python-build
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "protect_ingest.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *python-env

  decoder:
    container_name: protect-decoder
    build: *python-build
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "protect_decoder.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *python-env

  export:
    container_name: protect-export
    build: *python-build
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "protect_export.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *python-env

  rules:
    container_name: protect-rules
    build: *python-build
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "protect_rules.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *python-env

  automation:
    container_name: protect-automation
    build: *python-build
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "protect_automation.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *python-env

  integration:
    container_name: protect-integration
    build: *python-build
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "protect_integration.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *python-env

  mcp:
    container_name: protect-mcp
    build: *python-build
    restart: unless-stopped
    command: ["/app/.venv/bin/uvicorn", "protect_mcp.main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *python-env
      API_INTERNAL_URL: http://api:8000
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:${MCP_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Backup profile: mirrors the MinIO buckets to the remote backup bucket (architecture 28.5).
  # One-shot, started by scripts/backup.sh: docker compose --profile backup run --rm object-mirror
  object-mirror:
    container_name: protect-object-mirror
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [backup]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_SECURE: ${BACKUP_S3_SECURE:-true}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_KEY: ${BACKUP_S3_KEY:-}
      BACKUP_S3_KEY_SECRET: ${BACKUP_S3_KEY_SECRET:-}
      BACKUP_OBJECT_PREFIX: ${BACKUP_OBJECT_PREFIX:-objects}
      MIRROR_BUCKETS: ${MINIO_BUCKET_UPLOADS:-uploads} ${MINIO_BUCKET_EXPORTS:-exports} ${MINIO_BUCKET_LOG_FILES:-device-log-files}
    volumes:
      - ./docker/backup/mirror.sh:/mirror.sh:ro
    entrypoint: ["/bin/sh", "/mirror.sh"]

  # Observability profile: Grafana with an OpenTelemetry collector, Prometheus, Tempo and Loki in
  # one container (architecture 26.8). Set OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318 in .env.
  lgtm:
    container_name: protect-lgtm
    image: grafana/otel-lgtm:0.32.1
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LGTM_GRAFANA_PORT:-3001}:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm-data:/data

  frontend:
    container_name: protect-frontend
    build:
      context: services/frontend
    restart: unless-stopped
    depends_on:
      - api
      - mcp
    ports:
      # Localhost only: nginx on the server is the public face, and a port Docker publishes on
      # every interface bypasses the host firewall.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"

  # ChirpStack profile: a local LoRaWAN network server for end-to-end testing (phase 3).
  chirpstack-postgres:
    container_name: protect-chirpstack-postgres
    image: postgres:16-alpine
    profiles: ["chirpstack"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: chirpstack
      POSTGRES_PASSWORD: ${CHIRPSTACK_POSTGRES_PASSWORD}
      POSTGRES_DB: chirpstack
    volumes:
      - chirpstack-postgres-data:/var/lib/postgresql/data
      - ./docker/chirpstack/postgresql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpstack -d chirpstack"]
      interval: 10s
      timeout: 5s
      retries: 10

  chirpstack-redis:
    container_name: protect-chirpstack-redis
    image: redis:7.4-alpine
    profiles: ["chirpstack"]
    restart: unless-stopped
    command: ["redis-server", "--save", "300", "1", "--save", "60", "100", "--appendonly", "no"]
    volumes:
      - chirpstack-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  chirpstack-mosquitto:
    container_name: protect-chirpstack-mosquitto
    image: eclipse-mosquitto:2.0.22
    profiles: ["chirpstack"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHIRPSTACK_MQTT_PORT:-1883}:1883"
    volumes:
      - ./docker/chirpstack/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  chirpstack:
    container_name: protect-chirpstack
    image: chirpstack/chirpstack:4.19.1
    profiles: ["chirpstack"]
    restart: unless-stopped
    command: ["-c", "/etc/chirpstack"]
    depends_on:
      chirpstack-postgres:
        condition: service_healthy
      chirpstack-redis:
        condition: service_healthy
      chirpstack-mosquitto:
        condition: service_started
    environment:
      MQTT_BROKER_HOST: chirpstack-mosquitto
      REDIS_HOST: chirpstack-redis
      POSTGRESQL_HOST: chirpstack-postgres
      CHIRPSTACK_POSTGRES_PASSWORD: ${CHIRPSTACK_POSTGRES_PASSWORD}
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET}
    ports:
      - "127.0.0.1:${CHIRPSTACK_WEB_PORT:-8080}:8080"
    volumes:
      - ./docker/chirpstack/chirpstack:/etc/chirpstack:ro

  chirpstack-gateway-bridge:
    container_name: protect-chirpstack-gateway-bridge
    image: chirpstack/chirpstack-gateway-bridge:4.1.2
    profiles: ["chirpstack"]
    restart: unless-stopped
    depends_on:
      - chirpstack-mosquitto
    environment:
      MQTT_BROKER_HOST: chirpstack-mosquitto
    ports:
      - "127.0.0.1:1700:1700/udp"
    volumes:
      - ./docker/chirpstack/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge:ro

  chirpstack-rest-api:
    container_name: protect-chirpstack-rest-api
    image: chirpstack/chirpstack-rest-api:4.19.0
    profiles: ["chirpstack"]
    restart: unless-stopped
    command: ["--server", "chirpstack:8080", "--bind", "0.0.0.0:8090", "--insecure"]
    depends_on:
      - chirpstack
    ports:
      - "127.0.0.1:${CHIRPSTACK_REST_PORT:-8090}:8090"

networks:
  default:
    name: protect-network

volumes:
  postgres-data:
  pgbackrest-state:
  lgtm-data:
  redis-data:
  minio-data:
  chirpstack-postgres-data:
  chirpstack-redis-data:
