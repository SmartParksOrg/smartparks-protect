# Security updates only. Version bumps are done deliberately with the lockfile.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /services/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      react:
        applies-to: security-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        applies-to: security-updates
        patterns: ["vite", "@vitejs/*", "vitest"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
