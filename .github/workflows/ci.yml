name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_VERSION: "0.12.9"

jobs:
  python:
    name: python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, api]
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17.10-ts2.29.2
        env:
          POSTGRES_USER: protect
          POSTGRES_PASSWORD: protect-dev-password
          POSTGRES_DB: smartparks_protect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U protect -d smartparks_protect"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://protect:protect-dev-password@localhost:5432/smartparks_protect
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: protect
      MINIO_ROOT_PASSWORD: protect-dev-minio
      JWT_SECRET: ci-secret-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=protect -e MINIO_ROOT_PASSWORD=protect-dev-minio \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - name: Pytest
        run: uv run pytest tests/${{ matrix.package }} -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --only-group docs
      - run: uv run --only-group docs mkdocs build --strict

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose --profile chirpstack config --quiet
      - run: docker build -f services/api/Dockerfile .
