name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 5 * * 1"

env:
  UV_VERSION: "0.12.9"

jobs:
  python:
    name: python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, api, decoder, export, rules, automation, integration, mcp]
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17.10-ts2.29.2
        env:
          POSTGRES_USER: protect
          POSTGRES_PASSWORD: protect-dev-password
          POSTGRES_DB: smartparks_protect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U protect -d smartparks_protect"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://protect:protect-dev-password@localhost:5432/smartparks_protect
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: protect
      MINIO_ROOT_PASSWORD: protect-dev-minio
      JWT_SECRET: ci-secret-that-is-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=protect -e MINIO_ROOT_PASSWORD=protect-dev-minio \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - name: Pytest
        run: |
          set -o pipefail
          uv run pytest tests/${{ matrix.package }} -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Failures as annotations
        if: failure()
        run: grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while read -r line; do echo "::error::$line"; done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: English catalogue is current
        run: npm run i18n:check
      - run: npm run build
      - run: npm run test

  openapi:
    name: openapi schema is current
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://protect:protect-dev-password@localhost:5432/smartparks_protect
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: protect
      MINIO_ROOT_PASSWORD: protect-dev-minio
      JWT_SECRET: ci-secret-that-is-at-least-32-bytes-long
      CREDENTIALS_KEY: ci-credentials-key-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: uv sync --frozen --all-groups
      - run: cd services/frontend && npm ci
      - run: scripts/dev.sh openapi
      - name: Committed schema must match the API
        run: git diff --exit-code -- services/frontend/openapi.json services/frontend/src/api/schema.d.ts

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run mkdocs build --strict
      - name: Links, anchors, diagrams and the MCP tool reference
        run: uv run scripts/docs_check.py
        env:  # the MCP server is built to list its tools; the settings need these
          DATABASE_URL: postgresql+asyncpg://protect:protect-dev-password@localhost:5432/smartparks_protect
          REDIS_URL: redis://localhost:6379/0
          MINIO_ENDPOINT: localhost:9000
          MINIO_ROOT_USER: protect
          MINIO_ROOT_PASSWORD: protect-dev-minio
          JWT_SECRET: ci-secret-that-is-at-least-32-bytes-long
          CREDENTIALS_KEY: ci-credentials-key-long-enough

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Python dependencies (pip-audit, high and critical fail)
        run: |
          uv export --frozen --all-groups --no-hashes --no-emit-workspace --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --strict
      - name: Frontend dependencies (npm audit, high and critical fail)
        run: cd services/frontend && npm ci --ignore-scripts && npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose --profile chirpstack config --quiet
      - run: docker build -f docker/python.Dockerfile .
