[project]
name = "smartparks-protect-shared"
version = "0.0.0"
description = "Code shared by every Smart Parks Protect service. Imported as `shared`."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "redis==8.1.0",
    "alembic==1.19.1",
    "geoalchemy2==0.20.0",
    "psycopg[binary]==3.3.5",
    "cryptography==50.0.1",
    "aiomqtt==2.5.1",
    "minio==7.2.20",
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "aiosmtplib==5.1.2",
    "jinja2==3.1.6",
    "shapely==2.1.2",
    "pyjwt==2.13.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared"
module-root = ""
