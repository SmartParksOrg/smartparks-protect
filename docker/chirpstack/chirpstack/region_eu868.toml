# EU868 region for the local development profile.
# Reference: https://github.com/chirpstack/chirpstack-docker/blob/master/configuration/chirpstack/region_eu868.toml

[[regions]]
  name="eu868"
  description="EU868"
  common_name="EU868"

  [regions.gateway]
    force_gws_private=false

    [regions.gateway.backend]
      enabled="mqtt"

      [regions.gateway.backend.mqtt]
        topic_prefix="eu868"
        event_topic="eu868/gateway/+/event/+"
        state_topic="eu868/gateway/+/state/+"
        command_topic="eu868/gateway/{{ gateway_id }}/command/{{ command }}"
        server="tcp://$MQTT_BROKER_HOST:1883/"
        json=false
        qos=0
        clean_session=false

    [[regions.gateway.channels]]
      frequency=867100000
      bandwidth=125000
      modulation="LORA"
      spreading_factors=[7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency=867300000
      bandwidth=125000
      modulation="LORA"
      spreading_factors=[7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency=867500000
      bandwidth=125000
      modulation="LORA"
      spreading_factors=[7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency=867700000
      bandwidth=125000
      modulation="LORA"
      spreading_factors=[7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency=867900000
      bandwidth=125000
      modulation="LORA"
      spreading_factors=[7, 8, 9, 10, 11, 12]

  [regions.network]
    rx1_delay=1
    rx1_dr_offset=0
    rx2_dr=0
    rx2_frequency=869525000
    downlink_tx_power=-1
    adr_disabled=false
    min_dr=0
    max_dr=5
    enabled_uplink_channels=[]

    [[regions.network.extra_channels]]
      frequency=867100000
      min_dr=0
      max_dr=5

    [[regions.network.extra_channels]]
      frequency=867300000
      min_dr=0
      max_dr=5

    [[regions.network.extra_channels]]
      frequency=867500000
      min_dr=0
      max_dr=5

    [[regions.network.extra_channels]]
      frequency=867700000
      min_dr=0
      max_dr=5

    [[regions.network.extra_channels]]
      frequency=867900000
      min_dr=0
      max_dr=5

    [regions.network.class_b]
      ping_slot_dr=0
      ping_slot_frequency=869525000

    [regions.network.rejoin_request]
      enabled=false
      max_count_n=15
      max_time_n=15
