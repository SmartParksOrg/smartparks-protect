# pgBackRest configuration for the database container (architecture 28, phase 10).
# The image reads this path (PGBACKREST_CONFIG). Everything that varies per deployment, the
# repository, its credentials and the cipher, arrives as PGBACKREST_* environment variables from
# docker-compose.yml, so this file holds only the stanza and the paths inside the container.
[protect]
pg1-path=/home/postgres/pgdata/data

[global]
# The wrapper, so the restore_command pgBackRest writes on restore gets the same treatment.
cmd=/usr/local/bin/protect-pgbackrest
log-path=/home/postgres/pgdata/backup/log
lock-path=/tmp/pgbackrest
spool-path=/home/postgres/pgdata/backup/spool
archive-async=y
start-fast=y
process-max=2
