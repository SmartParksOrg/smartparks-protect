site_name: Smart Parks Protect
site_description: Self-hosted operational data platform for Smart Parks deployments
repo_url: https://github.com/SmartParksOrg/smartparks-protect
edit_uri: edit/main/docs/
strict: true
not_in_nav: |
  adr/template.md

theme:
  name: material
  logo: assets/logo-mark.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - assets/custom.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Getting started: getting-started/index.md
  - Concepts:
      - concepts/index.md
      - Domain model: concepts/domain-model.md
      - Timestamps and deduplication: concepts/timestamps-and-deduplication.md
  - Architecture:
      - architecture/index.md
      - Data model: architecture/data-model.md
      - Processing pipeline: architecture/processing-pipeline.md
      - Scalability: architecture/scalability.md
      - AddaxAI Connect reuse audit: architecture/addaxai-connect-reuse-audit.md
  - Devices:
      - devices/index.md
      - Driver interface: devices/driver-interface.md
      - OpenCollar Edge: devices/opencollar.md
      - OpenCollar protocol research: devices/opencollar-protocol-research.md
      - Device control: devices/device-control.md
  - Integrations:
      - integrations/index.md
      - Adapter interface: integrations/adapter-interface.md
      - ChirpStack: integrations/chirpstack/index.md
  - Analytics:
      - analytics/index.md
      - Data Explorer: analytics/data-explorer.md
      - Export: analytics/export.md
  - Rules:
      - rules/index.md
      - Automations and notifications: rules/automations.md
  - Administration:
      - administration/index.md
      - Permissions: administration/permissions.md
      - Notifications: administration/notifications.md
  - Operations:
      - operations/index.md
      - Benchmarks: operations/benchmarks.md
  - Troubleshooting: troubleshooting/index.md
  - API: api/index.md
  - MCP: mcp/index.md
  - Decisions:
      - adr/index.md
      - adr/0001-record-architecture-decisions.md
      - adr/0002-start-from-scratch.md
      - adr/0003-postgresql-timescaledb-postgis.md
      - adr/0004-redis-streams-event-bus.md
      - adr/0005-backend-and-frontend-stack.md
      - adr/0006-schema-versioning.md
      - adr/0007-canonical-domain-model.md
      - adr/0008-device-timestamp-deduplication.md
      - adr/0009-processing-trace-model.md
      - adr/0010-assignment-attribution.md
      - adr/0011-connectivity-adapter-boundary.md
      - adr/0012-rule-representation.md
      - adr/0013-control-action-schema.md
