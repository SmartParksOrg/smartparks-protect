[project]
name = "smartparks-protect"
version = "0.0.0"
description = "Workspace root for Smart Parks Protect. Services live in services/, shared code in shared/."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "services/*"]
exclude = ["services/frontend"]

[tool.uv.sources]
smartparks-protect-shared = { workspace = true }
smartparks-protect-api = { workspace = true }
smartparks-protect-ingest = { workspace = true }
smartparks-protect-decoder = { workspace = true }

[dependency-groups]
dev = [
    "smartparks-protect-shared",
    "smartparks-protect-api",
    "smartparks-protect-ingest",
    "smartparks-protect-decoder",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "httpx-ws==0.9.0",
]
docs = [
    "mkdocs<2",
    "mkdocs-material==9.7.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["shared", "services/api", "services/ingest", "services/decoder", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path", "fastapi.File", "fastapi.UploadFile", "protect_api.deps.require_permission", "protect_api.deps.require_project_role"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E501"]
"services/api/alembic/versions/**" = ["E501"]
"shared/shared/metrics/seeds.py" = ["E501"]
"shared/shared/device_drivers/opencollar/__init__.py" = ["E501"]
"scripts/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["shared", "services/api", "services/ingest", "services/decoder"]
packages = ["shared", "protect_api", "protect_ingest", "protect_decoder"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs running Postgres, Redis and MinIO (see .env.example)",
]
