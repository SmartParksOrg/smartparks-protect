---
# Firewall, the application user, sshd hardening with a drift check, security updates, fail2ban.
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install security packages
  apt:
    name: [ufw, fail2ban, unattended-upgrades]
    state: present

- name: Allow SSH, HTTP and HTTPS
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ allowed_ssh_port | default('22') }}"
    - "80"
    - "443"
  when: enable_firewall | default(true)

- name: Deny incoming by default, allow outgoing
  ufw:
    state: enabled
    policy: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { policy: deny, direction: incoming }
    - { policy: allow, direction: outgoing }
  when: enable_firewall | default(true)

- name: Create the application user
  user:
    name: "{{ app_user }}"
    shell: /bin/bash
    create_home: true
    groups: sudo
    append: true
    password: "{{ app_user_password | password_hash('sha512') if app_user_password is defined else omit }}"
    update_password: on_create

- name: Copy root's authorized keys to the application user
  block:
    - stat:
        path: /root/.ssh/authorized_keys
      register: root_keys
    - file:
        path: "/home/{{ app_user }}/.ssh"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0700"
    - copy:
        src: /root/.ssh/authorized_keys
        dest: "/home/{{ app_user }}/.ssh/authorized_keys"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
        remote_src: true
      when: root_keys.stat.exists

# sshd reads the first value of a keyword. Cloud images leave 50-cloud-init.conf behind with
# password login on, so the drop-in sorts before it. Read back with `sshd -T` so drift fails
# the deploy instead of looking hardened.
- name: Harden sshd
  copy:
    dest: /etc/ssh/sshd_config.d/01-protect-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      MaxAuthTries 4
  notify: restart sshd

- name: Validate sshd configuration
  command: sshd -t
  changed_when: false

- meta: flush_handlers

- name: Read the effective sshd settings
  command: sshd -T
  register: sshd_effective
  changed_when: false

- name: Fail when the hardening did not take
  assert:
    that:
      - "'passwordauthentication no' in sshd_effective.stdout"
      # sshd -T prints the older spelling of prohibit-password
      - "'permitrootlogin without-password' in sshd_effective.stdout or 'permitrootlogin prohibit-password' in sshd_effective.stdout"
    fail_msg: "sshd still allows password login; another config file overrides the drop-in"
    quiet: true

- name: Security updates only, never automatic reboots
  copy:
    dest: /etc/apt/apt.conf.d/52protect-unattended
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Enable periodic unattended upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: fail2ban on sshd only
  copy:
    dest: /etc/fail2ban/jail.d/protect.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      port = {{ allowed_ssh_port | default('22') }}
      maxretry = 5
      bantime = 1h
  notify: restart fail2ban

- name: Ensure fail2ban runs
  systemd:
    name: fail2ban
    state: started
    enabled: true
