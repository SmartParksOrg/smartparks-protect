---
- name: Tools
  apt:
    name: [git, curl, jq, vim, htop, ncdu]
    state: present
  when: install_tools | default(true)

# Which code runs. git_version pins a tag or a branch (main on a dev server). Unset, the newest
# vX.Y.Z tag wins, never a pre-release and never the head of main.
- name: Newest release tag
  command: git ls-remote --tags --refs --sort=-v:refname {{ git_repo }} 'v*'
  register: newest_release
  changed_when: false
  when: git_version | default('') | length == 0
  tags: [env-refresh]

- name: Checkout reference
  set_fact:
    checkout_ref: >-
      {{ git_version if git_version | default('') | length > 0
         else (newest_release.stdout_lines | map('regex_replace', '^.*refs/tags/', '')
               | select('match', '^v[0-9]+[.][0-9]+[.][0-9]+$') | first | default('')) }}
  tags: [env-refresh]

- name: Refuse to deploy without a reference
  assert:
    that: checkout_ref | trim | length > 0
    fail_msg: "No vX.Y.Z release tag at {{ git_repo }}; tag a release or set git_version"
    quiet: true
  tags: [env-refresh]

- name: Application directory
  file:
    path: "{{ app_directory }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Checkout {{ checkout_ref | trim }}
  git:
    repo: "{{ git_repo }}"
    dest: "{{ app_directory }}"
    version: "{{ checkout_ref | trim }}"
    force: true
    accept_hostkey: true
  become_user: "{{ app_user }}"
  tags: [env-refresh]

- name: Install the commit hook
  command: git config core.hooksPath .githooks
  args:
    chdir: "{{ app_directory }}"
  become_user: "{{ app_user }}"
  changed_when: false
