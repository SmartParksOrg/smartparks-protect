---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Remove the default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Does a certificate exist
  stat:
    path: "/etc/letsencrypt/live/{{ domain_name | default('') }}/fullchain.pem"
  register: ssl_cert
  when: enable_ssl | default(false) and domain_name is defined

- name: Directory of the page nginx shows while the stack is down
  file:
    path: /var/www/protect
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: The page shown while the stack is down (decision D329)
  template:
    src: unavailable.html.j2
    dest: /var/www/protect/unavailable.html
    owner: root
    group: root
    mode: "0644"

- name: Site configuration
  template:
    src: protect.conf.j2
    dest: /etc/nginx/sites-available/protect.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable the site
  file:
    src: /etc/nginx/sites-available/protect.conf
    dest: /etc/nginx/sites-enabled/protect.conf
    state: link
  notify: reload nginx

- name: Validate nginx configuration
  command: nginx -t
  changed_when: false

# Handlers run at the end of the play by default, after the app-deploy role has restarted the
# stack; the configuration this role changed must be live before that (the first deploy of the
# update page still showed bare 502s for that reason, 2026-10-16).
- name: Apply the nginx configuration now
  meta: flush_handlers

- name: nginx runs
  systemd:
    name: nginx
    state: started
    enabled: true
