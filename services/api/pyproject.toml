[project]
name = "smartparks-protect-api"
version = "0.0.0"
description = "Smart Parks Protect API: REST, WebSocket, OpenAPI, auth, admin, vector tiles."
requires-python = ">=3.12,<3.13"
dependencies = [
    "smartparks-protect-shared",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    "fastapi-users[sqlalchemy]==15.0.5",
    "aiosmtplib==5.1.2",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "shapely==2.1.2",
    "mcp==2.1.1",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "protect_api"
module-root = ""
